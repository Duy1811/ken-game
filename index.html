<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kén</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#06060a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8e8f0}
  #stage{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
  #bubble{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 14px);max-height:34dvh;overflow-y:auto;padding:14px 16px;border-radius:18px;background:rgba(14,14,22,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);font-size:15px;line-height:1.55;opacity:0;transform:translateY(-8px);transition:.5s cubic-bezier(.2,.9,.2,1);pointer-events:none;white-space:pre-wrap;z-index:5}
  #bubble.on{opacity:1;transform:translateY(0)}
  #bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;align-items:flex-end;z-index:10}
  #inp{flex:1;min-height:48px;max-height:120px;padding:14px 16px;border-radius:24px;border:1px solid rgba(255,255,255,.09);background:rgba(20,20,30,.8);backdrop-filter:blur(14px);color:#fff;font-size:16px;resize:none;outline:none;font-family:inherit;line-height:1.4}
  #inp::placeholder{color:#55556a}
  #send{width:48px;height:48px;border-radius:50%;border:none;flex:none;background:linear-gradient(140deg,#5b6ee1,#8b5cf6);color:#fff;font-size:20px;display:grid;place-items:center;transition:.2s}
  #send:active{transform:scale(.9)}
  #send[disabled]{opacity:.35}
  #gear{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 14px);width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(14,14,22,.6);color:#8888a0;font-size:15px;z-index:20}
  #silentToggle{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 72px);width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(14,14,22,.55);backdrop-filter:blur(10px);color:#7777a0;font-size:17px;z-index:15;transition:.35s cubic-bezier(.2,.9,.2,1)}
  #silentToggle:active{transform:scale(.9)}
  body.silent #silentToggle{left:auto;bottom:auto;right:14px;top:calc(env(safe-area-inset-top) + 14px);background:rgba(14,14,22,.78);color:#bbb;border-color:rgba(255,255,255,.14)}
  body.silent #bar{opacity:0;pointer-events:none;transition:opacity .4s}
  body.silent #gear{opacity:0;pointer-events:none}
  body.silent #bubble{top:auto;bottom:22dvh;left:16%;right:16%;max-height:24dvh;padding:0;background:none;border:none;backdrop-filter:none;box-shadow:none;font-style:italic;font-size:14.5px;line-height:1.7;color:rgba(200,200,220,.72);text-align:center;transform:none}
  body.silent #bubble.on{transform:none;opacity:1}
  #panel{position:fixed;inset:0;background:rgba(4,4,8,.94);z-index:30;padding:24px;padding-top:calc(env(safe-area-inset-top) + 24px);overflow-y:auto;display:none}
  #panel.on{display:block}
  #panel label{display:block;font-size:12px;color:#7777a0;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em}
  #panel input,#panel select{width:100%;padding:12px;border-radius:10px;font-size:16px;border:1px solid rgba(255,255,255,.1);background:#12121c;color:#fff;font-family:inherit}
  .row{display:flex;gap:8px;margin-top:24px}
  .row button{flex:1;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#1a1a26;color:#ddd;font-size:14px;font-family:inherit}
  #stats{font-size:12px;color:#666680;line-height:1.9;margin-top:14px;font-variant-numeric:tabular-nums}
  #diary{max-height:36dvh;overflow-y:auto;font-size:13px;line-height:1.6;color:#9999b8;background:#0d0d16;border-radius:12px;padding:14px;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bubble"></div>
<button id="gear">⚙</button>
<button id="silentToggle">☾</button>
<div id="bar"><textarea id="inp" rows="1" placeholder="Nói với nó…"></textarea><button id="send">↑</button></div>

<div id="panel">
  <div style="font-size:20px;font-weight:600;margin-bottom:4px">Cài đặt</div>
  <div style="font-size:12px;color:#666680">Chỉ lưu trên máy này. Không gửi đi đâu ngoài LLM.</div>
  
  <label>Engine LLM</label>
  <select id="llmProvider">
    <option value="openrouter">OpenRouter (Khuyên dùng - Miễn phí)</option>
    <option value="gemini">Google Gemini (Miễn phí)</option>
    <option value="anthropic">Anthropic Claude (Trả tiền)</option>
  </select>

  <div id="openrouterBlock">
    <label>OpenRouter API key</label>
    <input id="openrouterKey" type="password" placeholder="sk-or-v1-..." autocomplete="off">
    <label>Model OpenRouter</label>
    <select id="openrouterModel">
      <option value="dots-studio/dots-3-note-preview:free">Dots 3 Note (Ổn định nhất)</option>
      <option value="nvidia/nemotron-3-ultra-550b-a55b:free">Nemotron 3 Ultra (Rất thông minh)</option>
      <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Dự phòng)</option>
    </select>
    <div style="font-size:11px;color:#666680;margin-top:8px;line-height:1.6">Lấy key: <b style="color:#8b8bff">openrouter.ai/keys</b></div>
  </div>

  <div id="geminiBlock" style="display:none">
    <label>Gemini API key</label>
    <input id="geminiKey" type="password" placeholder="AIza..." autocomplete="off">
    <label>Model Gemini</label>
    <select id="geminiModel">
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
      <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
      <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
    </select>
  </div>

  <div id="anthropicBlock" style="display:none">
    <label>Anthropic API key</label>
    <input id="anthropicKey" type="password" placeholder="sk-ant-..." autocomplete="off">
    <label>Model Claude</label>
    <select id="anthropicModel"><option value="claude-sonnet-4-5">Sonnet 4.5</option><option value="claude-haiku-4-5">Haiku 4.5</option></select>
  </div>

  <label>Giọng nói</label>
  <select id="v"><option value="1">Bật</option><option value="0">Tắt</option></select>
  <div class="row" style="margin-top:12px"><button id="testVoice">Nghe thử giọng</button></div>
  
  <div id="stats"></div>
  
  <label>Tủ đồ</label>
  <div id="tuDo" style="max-height:44dvh;overflow-y:auto;background:#0d0d16;border-radius:12px;padding:12px">—</div>
  
  <label>Những gì nó biết về bạn</label>
  <div id="facts" style="max-height:30dvh;overflow-y:auto;font-size:12px;line-height:1.7;color:#9999b8;background:#0d0d16;border-radius:12px;padding:14px">—</div>
  
  <label>Ký ức (bản gốc → bản đang nhớ)</label>
  <div id="memories" style="max-height:40dvh;overflow-y:auto;font-size:12px;line-height:1.6;color:#9999b8;background:#0d0d16;border-radius:12px;padding:14px">—</div>
  
  <label>Nhật ký nó viết về bạn</label>
  <div id="diary">—</div>
  
  <div class="row"><button id="close">Đóng</button><button id="wipe" style="color:#ff6b6b">Xoá hết</button></div>
</div>

<script>
const GIAI_DOAN = [{ nguong: 0.00, ten: 'sơ sinh' }, { nguong: 0.25, ten: 'thơ ấu' }, { nguong: 0.50, ten: 'thiếu niên' }, { nguong: 0.75, ten: 'trưởng thành' }, { nguong: 1.00, ten: 'chín' }];
function getGiaiDoan() { let g = GIAI_DOAN[0]; for (const gd of GIAI_DOAN) if (S.truongThanh >= gd.nguong) g = gd; return g; }

const DEF = () => ({
  camXuc: { vui:50, tinTuong:15, buon:10, soHai:30, toMo:60, phanKhang:20 },
  hinhThanh: 0.02, truongThanh: 0, giaiDoanDaDat: [], daNo: false, soLanNoi: 0, kyUc: [], nhatKy: [], facts: [],
  hoiNguoc: { turnCount:0, missStreak:0, dangChoTraLoi:false, lastAskedAt:0 }, trangPhuc: null, tuDo: [], hoiThoai: [], lanCuoi: Date.now(),
  settings: { 
    llmProvider: 'openrouter', 
    openrouterKey: '', openrouterModel: 'dots-studio/dots-3-note-preview:free',
    geminiKey: '', geminiModel: 'gemini-3.5-flash-lite', 
    anthropicKey: '', anthropicModel: 'claude-sonnet-4-5', 
    voice: '1' 
  }
});

let S;
try { S = Object.assign(DEF(), JSON.parse(localStorage.getItem('ken_v1')||'{}')); } catch { S = DEF(); }

// MIGRATION
if (!S.settings) S.settings = DEF().settings;
if (!S.camXuc) S.camXuc = DEF().camXuc;
if (S.daNo === undefined) S.daNo = false;
if (S.truongThanh === undefined) S.truongThanh = 0;
if (!Array.isArray(S.giaiDoanDaDat)) S.giaiDoanDaDat = [];
if (!Array.isArray(S.facts)) S.facts = [];
if (!S.hoiNguoc || typeof S.hoiNguoc !== 'object') S.hoiNguoc = { turnCount:0, missStreak:0, dangChoTraLoi:false, lastAskedAt:0 };
if (!Array.isArray(S.tuDo)) S.tuDo = [];
if (!S.settings.llmProvider) S.settings.llmProvider = 'openrouter';
if (S.settings.openrouterKey === undefined) S.settings.openrouterKey = '';
if (!S.settings.openrouterModel || S.settings.openrouterModel === 'google/gemma-2-9b-it:free') S.settings.openrouterModel = 'dots-studio/dots-3-note-preview:free';
if (S.settings.geminiKey === undefined) S.settings.geminiKey = '';
if (!S.settings.geminiModel) S.settings.geminiModel = 'gemini-3.5-flash-lite';
if (S.settings.anthropicKey === undefined) S.settings.anthropicKey = '';
if (!S.settings.anthropicModel) S.settings.anthropicModel = 'claude-sonnet-4-5';

if (!S.trangPhuc) { S.trangPhuc = { ao:null, quan:null, mu:null, phuKien:null }; } 
else if (S.trangPhuc.ten && !S.trangPhuc.ao) {
  const old = S.trangPhuc; const migrated = { ten: old.ten, mau: old.mau, hoaTiet: old.hoaTiet, kieu: old.kieu || 'ao', ts: Date.now(), dip: 'lần đầu', camXucLucTao: { ...S.camXuc } };
  S.trangPhuc = { ao: migrated, quan:null, mu:null, phuKien:null }; S.tuDo.push({ slot: 'ao', ...migrated });
}
if (!S.trangPhuc.ao) S.trangPhuc.ao = null; if (!S.trangPhuc.quan) S.trangPhuc.quan = null; if (!S.trangPhuc.mu) S.trangPhuc.mu = null; if (!S.trangPhuc.phuKien) S.trangPhuc.phuKien = null;
if (Array.isArray(S.kyUc)) { for (const m of S.kyUc) { if (m.banGoc === undefined) m.banGoc = m.t; if (m.doMeo === undefined) m.doMeo = 0; if (m.lan === undefined) m.lan = 0; if (m.lanCuoi === undefined) m.lanCuoi = 0; } }
for (const gd of GIAI_DOAN) { if (gd.nguong > 0 && S.truongThanh >= gd.nguong && !S.giaiDoanDaDat.includes(gd.nguong)) S.giaiDoanDaDat.push(gd.nguong); }

let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { S.lanCuoi = Date.now(); localStorage.setItem('ken_v1', JSON.stringify(S)); }, 300); }

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);

const COL = { vui:[255,198,96], tinTuong:[110,225,215], buon:[105,115,225], soHai:[140,175,150], toMo:[240,135,205], phanKhang:[255,95,65] };
const body = { scale:1, tilt:0, squeeze:1, shake:0 }; let target = { scale:1, tilt:0, squeeze:1, shake:0 };
function applyCoThe(c) { const M = { run:{scale:1,tilt:0,squeeze:.96,shake:6}, nghieng:{scale:1,tilt:.14,squeeze:1,shake:0}, coLai:{scale:.88,tilt:.05,squeeze:.86,shake:2}, gianRa:{scale:1.10,tilt:0,squeeze:1.10,shake:0}, im:{scale:1,tilt:0,squeeze:1,shake:0} }; target = M[c] || M.im; }
const parts = Array.from({length:46}, () => ({ a: Math.random()*Math.PI*2, r: .55 + Math.random()*.95, s: .15 + Math.random()*.55, o: Math.random()*Math.PI*2, sz: .6 + Math.random()*2.2 }));
let blink = 0, nextBlink = performance.now() + 2500, typing = false, t0 = performance.now(), mouthOpen = 0;
const lipSync = { active:false, startTime:0, duration:0, safety:null };
let silentMode = false, silentScale = 1; const gaze = { x:0, y:0, tx:0, ty:0, nextChange:0 };
const chuDong = { lastAt: 0, sessionCount: 0, missStreak: 0, lastUserMsgAt: 0, wakeUpAt: Date.now(), maxPerSession: 2 };
const HEAD_Y = -1.25, HEAD_RX = 0.52, HEAD_RY = 0.58;

function blendColor() {
  const c = S.camXuc; let r=0,g=0,b=0,sum=0;
  for (const k in COL) { const w = Math.pow(Math.max(c[k]||0, 1)/100, 1.6); r += COL[k][0]*w; g += COL[k][1]*w; b += COL[k][2]*w; sum += w; }
  r = r/sum; g = g/sum; b = b/sum; const sat = 1 + (S.truongThanh || 0) * 0.35; const lum = r*0.299 + g*0.587 + b*0.114;
  r = Math.max(0, Math.min(255, lum + (r - lum) * sat)); g = Math.max(0, Math.min(255, lum + (g - lum) * sat)); b = Math.max(0, Math.min(255, lum + (b - lum) * sat));
  return [r|0, g|0, b|0];
}
function blobPath(cx, cy, R, time, wob, sq, tilt) {
  ctx.beginPath(); const N = 84;
  for (let i=0; i<=N; i++) {
    const a = i/N * Math.PI*2; const rr = R * (1 + .045*Math.sin(3*a + time*.0007) + .028*Math.sin(5*a - time*.0011) + .018*Math.sin(8*a + time*.0016)*wob);
    let x = Math.cos(a) * rr * sq; let y = Math.sin(a) * rr * (2 - sq) * 1.06;
    const ct = Math.cos(tilt), st = Math.sin(tilt); const x2 = x*ct - y*st, y2 = x*st + y*ct;
    i ? ctx.lineTo(cx+x2, cy+y2) : ctx.moveTo(cx+x2, cy+y2);
  } ctx.closePath();
}
function star(x,y,R,r) { ctx.beginPath(); for (let i=0; i<8; i++) { const a = i*Math.PI/4; const rad = i%2 ? r : R; i ? ctx.lineTo(x+Math.cos(a)*rad, y+Math.sin(a)*rad) : ctx.moveTo(x+Math.cos(a)*rad, y+Math.sin(a)*rad); } ctx.closePath(); ctx.fill(); }
function hex2rgb(h) { h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function hex2rgbSafe(h) { try { return hex2rgb(h); } catch { return [136,153,255]; } }

const hatch = { active:false, startTime:0, progress:0, fragments:[], scheduled:false };
const milestoneFx = { active:false, startTime:0 };
function makeFragments() { const out = []; for (let i=0; i<16; i++) { const a = Math.random()*Math.PI*2; out.push({ a, dist: 0.7 + Math.random()*0.8, vy: -0.3 - Math.random()*0.7, vrot: (Math.random()-0.5)*0.35, r: 0.05 + Math.random()*0.08, life: 0.5 + Math.random()*0.7, seed: Math.random()*100 }); } return out; }
function startHatch() { if (S.daNo) return; hatch.active = true; hatch.startTime = performance.now(); hatch.progress = 0; hatch.fragments = makeFragments(); hatch.scheduled = false; }
function updateHatch(now) {
  if (!hatch.active) return; hatch.progress = Math.min(1, (now - hatch.startTime) / 3500);
  if (hatch.progress >= 1) { hatch.active = false; if (!S.daNo) { S.daNo = true; S.hinhThanh = 1; save(); setTimeout(firstWordsAfterHatch, 800); setTimeout(resetIdleTimer, 5000); setTimeout(startChuDongTimer, 5000); } }
}
function scheduleBlink(now) { const base = silentMode ? 4500 : 2200; const rand = silentMode ? 6000 : 4200; nextBlink = now + base + Math.random() * rand; }

function drawLongMay(now, hrx, hry, hy, r, g, b, alive) {
  if (alive <= 0.01) return; const c = S.camXuc; const ex = hrx * 0.385; const ey = hy - hry * 0.04; const er = hry * 0.13; const by = ey - er * 1.8; const bw = er * 1.3;
  const surprise = Math.max(0, (c.soHai - 45) / 55), angry = Math.max(0, (c.phanKhang - 50) / 50), sad = Math.max(0, (c.buon - 45) / 55), curious = Math.max(0, (c.toMo - 50) / 50), happy = Math.max(0, (c.vui - 55) / 45);
  const lift = surprise * er * 0.55 + happy * er * 0.15; const drop = sad * er * 0.15;
  ctx.strokeStyle = `rgba(${Math.min(255,r+50)},${Math.min(255,g+45)},${Math.min(255,b+55)},${alive*0.72})`; ctx.lineWidth = Math.max(1.6, hry * 0.034); ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    const bx = s * ex; const baseY = by - lift + drop; let innerY = baseY; let outerY = baseY;
    if (angry > 0.1) { innerY += angry * er * 0.40; outerY -= angry * er * 0.15; }
    if (sad > 0.1) { innerY -= sad * er * 0.28; outerY += sad * er * 0.20; }
    if (curious > 0.3 && s === 1) { outerY -= curious * er * 0.40; }
    ctx.beginPath(); ctx.moveTo(bx - s * bw * 0.5, innerY); ctx.quadraticCurveTo(bx, baseY - er * 0.08, bx + s * bw * 0.5, outerY); ctx.stroke();
  }
}
function drawMat(now, R, hrx, hry, hy, r, g, b, alive) {
  if (alive <= 0.01) return; if (now > nextBlink) { blink = 1; scheduleBlink(now); } blink *= 0.9;
  const open = Math.max(0.06, 1 - blink); const c = S.camXuc; const tt = S.truongThanh || 0;
  const ex = hrx * 0.385, ey = hy - hry * 0.04, er = hry * 0.13 * open;
  const eyeCol = `rgba(${Math.min(255,r+95)},${Math.min(255,g+95)},${Math.min(255,b+95)},${alive})`;
  for (const s of [-1, 1]) { ctx.save(); ctx.shadowBlur = (18 + tt * 12) * alive; ctx.shadowColor = eyeCol; ctx.fillStyle = eyeCol; ctx.beginPath(); ctx.ellipse(s * ex, ey, er * 1.15, er, 0, 0, 7); ctx.fill(); ctx.restore(); }
  const gx = silentMode ? gaze.x : (c.soHai - c.tinTuong) / 100 * 0.3; const gy = silentMode ? gaze.y : (c.buon - c.toMo) / 100 * 0.7;
  ctx.fillStyle = `rgba(10,10,16,${alive * 0.85})`;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * ex + gx * er * 0.55, ey + gy * er * 0.7, er * 0.42, er * 0.55 * open, 0, 0, 7); ctx.fill(); }
}
function drawMieng(now, hrx, hry, hy, r, g, b, alive) {
  if (alive <= 0.01) return; const c = S.camXuc; const mx = 0, my = hy + hry * 0.42, mw = hrx * 0.35;
  const smile = (c.vui - 50) / 50, frown = (c.buon - 50) / 50, tight = (c.phanKhang - 50) / 50;
  const curve = smile * 0.6 - frown * 0.85, width = 1 + smile * 0.12 - tight * 0.20;
  const baseOpen = Math.max(0, (c.soHai - 60) / 40 * 0.4); let targetOpen = baseOpen;
  if (lipSync.active) { const elapsed = now - lipSync.startTime; if (elapsed < lipSync.duration) { const t = elapsed / 1000; const s = Math.sin(t * 47.0) * 0.5 + Math.sin(t * 31.3) * 0.3 + Math.sin(t * 73.7) * 0.2; targetOpen = Math.max(targetOpen, 0.28 + Math.abs(s) * 0.55); } }
  mouthOpen += (targetOpen - mouthOpen) * 0.4; const open = Math.max(0, Math.min(1, mouthOpen));
  const openH = hry * 0.16 * open, curveY = curve * hry * 0.09;
  ctx.fillStyle = `rgba(${(r*0.22)|0},${(g*0.18)|0},${(b*0.28)|0},${alive*0.9})`;
  if (open > 0.03) { ctx.beginPath(); ctx.ellipse(mx, my + curveY * 0.3, mw * width * 0.55, openH, 0, 0, 7); ctx.fill(); }
  const leftX = mx - mw * width, rightX = mx + mw * width, topY = my - openH * 0.5;
  ctx.strokeStyle = `rgba(${Math.min(255,r+60)},${Math.min(255,g+45)},${Math.min(255,b+55)},${alive*0.62})`; ctx.lineWidth = Math.max(1.3, hry * 0.028); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(leftX, topY); ctx.quadraticCurveTo(mx, topY + curveY * 2, rightX, topY); ctx.stroke();
  if (open > 0.15) { const botY = my + openH * 0.6; ctx.beginPath(); ctx.moveTo(leftX + mw * 0.25, botY); ctx.quadraticCurveTo(mx, botY + curveY * 0.4, rightX - mw * 0.25, botY); ctx.stroke(); }
}
function drawPattern(pc, hoaTiet, R, xMin, xMax, yMin, yMax) {
  if (hoaTiet === 'khong' || !hoaTiet) return; ctx.save(); ctx.clip();

t dòng nhật ký ngắn",\n  "factMoi": null hoặc {"noiDung":"thông tin mới ngắn gọn","loai":"thoiQuen|soThich|moiQuanHe|suKien|giaTri|camXuc"},\n  "coHoi": false\n}\n\n- camXuc là DELTA, mỗi số -12..12.\n- coThe: "im" | "run" | "nghieng" | "coLai" | "gianRa"\n- trangPhuc: chỉ điền khi được yêu cầu mặc/cởi. Mỗi món BẮT BUỘC có "slot" và "kieu" (trừ khi "bo":true).\n- Kiểu hợp lệ: ao ∈ {ao,vay,dam,khoac,lua} · quan ∈ {dai,ngan,xoe} · mu ∈ {tron,non} · phuKien ∈ {vongCo,giayCao}\n- Mặc cả bộ → array 3-4 món. Mặc 1 món → 1 object.\n- factMoi: CHỈ ghi khi user tiết lộ điều MỚI, CỤ THỂ. KHÔNG ghi câu hỏi, cảm xúc nhất thời, câu đùa.\n- coHoi: true nếu "noi" có "?". Không hỏi → false.`;
}

async function callAPI(userText) {
  const candidate = pickRecall(userText); const sys = buildSystem(userText, candidate); const provider = S.settings.llmProvider || 'openrouter';
  if (provider === 'openrouter') { if (!S.settings.openrouterKey) throw new Error('Chưa có OpenRouter key. Bấm ⚙ để nhập.'); return callOpenRouter(userText, sys); }
  if (provider === 'gemini') { if (!S.settings.geminiKey) throw new Error('Chưa có Gemini key. Bấm ⚙ để nhập.'); return callGemini(userText, sys); }
  if (provider === 'anthropic') { if (!S.settings.anthropicKey) throw new Error('Chưa có Anthropic key. Bấm ⚙ để nhập.'); const msgs = [...S.hoiThoai.slice(-14), { role:'user', content:userText }]; return callAnthropic(msgs, sys, 700); }
  throw new Error('Provider không hợp lệ');
}

async function callOpenRouter(userText, systemPrompt) {
  const msgs = [{ role: 'system', content: systemPrompt }];
  for (const m of S.hoiThoai.slice(-14)) { msgs.push({ role: m.role, content: m.content }); }
  msgs.push({ role: 'user', content: userText });

  const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${S.settings.openrouterKey}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.href, 'X-Title': 'Ken Game' },
      body: JSON.stringify({ model: S.settings.openrouterModel || 'dots-studio/dots-3-note-preview:free', messages: msgs, max_tokens: 800, temperature: 0.95, response_format: { type: "json_object" } }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (!res.ok) { const e = await res.text(); throw new Error('OpenRouter ' + res.status + ': ' + e.slice(0, 200)); }
    const data = await res.json(); const text = data.choices?.[0]?.message?.content || ''; return parseJSON(text);
  } catch (e) { clearTimeout(timeoutId); if (e.name === 'AbortError') throw new Error('Hết thời gian chờ'); throw e; }
}

async function callGemini(userText, systemPrompt){
  const contents = [];
  for (const m of S.hoiThoai.slice(-14)){ contents.push({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }); }
  contents.push({ role: 'user', parts: [{ text: userText }] });
  const model = S.settings.geminiModel || 'gemini-3.5-flash-lite';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.settings.geminiKey}`;
  const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ system_instruction: { parts: [{ text: systemPrompt }] }, contents, generationConfig: { response_mime_type: 'application/json', maxOutputTokens: 1024, temperature: 0.95 } }), signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok){ const e = await res.text(); throw new Error('Server đang bận (Mã ' + res.status + '). Thử lại sau nhé!'); }
    const data = await res.json(); const text = data.candidates?.[0]?.content?.parts?.[0]?.text || ''; return parseJSON(text);
  } catch (e) { clearTimeout(timeoutId); if (e.name === 'AbortError') throw new Error('Google phản hồi quá lâu, vui lòng thử lại!'); throw e; }
}

async function callAnthropic(messages, systemPrompt, maxTok = 700) {
  const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key': S.settings.anthropicKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body: JSON.stringify({ model: S.settings.anthropicModel || 'claude-sonnet-4-5', max_tokens: maxTok, system: systemPrompt, messages }) });
  if (!res.ok){ const e = await res.text(); throw new Error('Anthropic ' + res.status + ': ' + e.slice(0,200)); }
  const data = await res.json(); const raw = (data.content||[]).map(b=>b.text||'').join(''); return parseJSON(raw);
}

async function apiRequest(messages, systemPrompt, maxTok = 700) {
  const provider = S.settings.llmProvider || 'openrouter';
  if (provider === 'openrouter') {
    if (!S.settings.openrouterKey) throw new Error('Chưa có OpenRouter key');
    const msgs = [{ role: 'system', content: systemPrompt }];
    for (const m of messages) { msgs.push({ role: m.role, content: m.content }); }
    const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${S.settings.openrouterKey}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.href, 'X-Title': 'Ken Game' },
        body: JSON.stringify({ model: S.settings.openrouterModel || 'dots-studio/dots-3-note-preview:free', messages: msgs, max_tokens: maxTok, temperature: 0.95, response_format: { type: "json_object" } }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!res.ok) { const e = await res.text(); throw new Error('OpenRouter ' + res.status + ': ' + e.slice(0, 200)); }
      const data = await res.json(); const text = data.choices?.[0]?.message?.content || ''; return parseJSON(text);
    } catch (e) { clearTimeout(timeoutId); if (e.name === 'AbortError') throw new Error('Hết thời gian chờ'); throw e; }
  } else if (provider === 'gemini') {
    if (!S.settings.geminiKey) throw new Error('Chưa có Gemini key');
    const contents = messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const model = S.settings.geminiModel || 'gemini-3.5-flash-lite';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.settings.geminiKey}`;
    const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ system_instruction: { parts: [{ text: systemPrompt }] }, contents, generationConfig: { response_mime_type: 'application/json', maxOutputTokens: maxTok, temperature: 0.95 } }), signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok){ const e = await res.text(); throw new Error('Gemini ' + res.status + ': ' + e.slice(0, 200)); }
      const data = await res.json(); const text = data.candidates?.[0]?.content?.parts?.[0]?.text || ''; return parseJSON(text);
    } catch (e) { clearTimeout(timeoutId); if (e.name === 'AbortError') throw new Error('Hết thời gian chờ'); throw e; }
  }
  return callAnthropic(messages, systemPrompt, maxTok);
}

function parseJSON(raw) { let s = raw.trim(); s = s.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim(); const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a >= 0 && b > a) s = s.slice(a, b+1); try { return JSON.parse(s); } catch { return { noi: raw.slice(0,400), camXuc:{}, coThe:'im', nho:null, trangPhuc:null, nhatKy:null }; } }

function applyResult(r, userText, opts = {}) {
  const prevHinhThanh = S.hinhThanh; const d = r.camXuc || {};
  for (const k in S.camXuc){ const v = Number(d[k]); if (!isNaN(v)) S.camXuc[k] = Math.max(0, Math.min(100, S.camXuc[k] + Math.max(-14, Math.min(14, v)))); }
  if (!opts.noGrow) { S.soLanNoi++; const grow = 0.006 + (S.camXuc.tinTuong/100)*0.010 + (S.camXuc.toMo/100)*0.004; S.hinhThanh = Math.min(1, S.hinhThanh + grow); if (S.camXuc.phanKhang > 75) S.hinhThanh = Math.max(0, S.hinhThanh - 0.004); }
  if (prevHinhThanh < 1 && S.hinhThanh >= 1 && !S.daNo && !hatch.scheduled && !hatch.active){ hatch.scheduled = true; setTimeout(startHatch, 1800); }
  if (S.daNo) {
    let emoDepth = 0; for (const k in d) emoDepth += Math.abs(Number(d[k]) || 0); emoDepth = Math.min(1, emoDepth / 30);
    const baseGrow = 0.015 * (1 - S.truongThanh * 0.5); const bonus = (S.camXuc.tinTuong > 60 ? 0.004 : 0) + (emoDepth > 0.4 ? 0.004 : 0); const penalty = S.camXuc.phanKhang > 65 ? 0.005 : 0;
    const before = S.truongThanh; S.truongThanh = Math.max(0, Math.min(1, S.truongThanh + baseGrow + bonus - penalty));
    for (const gd of GIAI_DOAN) { if (gd.nguong > 0 && before < gd.nguong && S.truongThanh >= gd.nguong && !S.giaiDoanDaDat.includes(gd.nguong)){ S.giaiDoanDaDat.push(gd.nguong); setTimeout(() => sayMilestone(gd), 2000); } }
  }
  if (r.nho) { const emo = dominantEmo(); const w = 3 + Math.abs(S.camXuc.vui-50)/18 + Math.abs(S.camXuc.buon-50)/18; nho(r.nho, emo, w); }
  if (userText && userText.length > 18 && Math.random() < .5){ nho(userText, dominantEmo(), 2); }
  if (r.trangPhuc) {
    const items = Array.isArray(r.trangPhuc) ? r.trangPhuc : [r.trangPhuc];
    for (const item of items) {
      if (!item || !item.slot) continue; const slot = item.slot; if (!['ao','quan','mu','phuKien'].includes(slot)) continue;
      if (item.bo === true) { S.trangPhuc[slot] = null; continue; } if (!item.mau) continue;
      const kieuHopLe = { ao: ['ao','vay','dam','khoac','lua'], quan: ['dai','ngan','xoe'], mu: ['tron','non'], phuKien: ['vongCo','giayCao'] }[slot];
      const piece = { ten: (item.ten || 'không tên').slice(0, 40), mau: /^#[0-9a-f]{6}$/i.test(item.mau) ? item.mau : '#8899ff', hoaTiet: ['sao','cham','soc','khong'].includes(item.hoaTiet) ? item.hoaTiet : 'khong', kieu: kieuHopLe.includes(item.kieu) ? item.kieu : kieuHopLe[0], ts: Date.now(), dip: (item.dip || userText || '').slice(0, 60), camXucLucTao: { ...S.camXuc } };
      S.trangPhuc[slot] = piece;
      const dup = S.tuDo.find(x => x.slot === slot && x.ten === piece.ten && x.mau === piece.mau);
      if (!dup) { S.tuDo.push({ slot, ...piece }); if (S.tuDo.length > 40){ S.tuDo.sort((a,b) => b.ts - a.ts); S.tuDo = S.tuDo.slice(0, 40); } }
    }
  }
  if (r.nhatKy) { S.nhatKy.push(r.nhatKy.slice(0,300)); if (S.nhatKy.length > 80) S.nhatKy = S.nhatKy.slice(-80); }
  if (r.factMoi && r.factMoi.noiDung) { addFact(r.factMoi.noiDung, r.factMoi.loai); }
  if (!opts.noGrow && userText) {
    S.hoiNguoc.turnCount++;
    if (S.hoiNguoc.dangChoTraLoi) { if (userText.length < 15) S.hoiNguoc.missStreak = Math.min(3, S.hoiNguoc.missStreak + 1); else S.hoiNguoc.missStreak = Math.max(0, S.hoiNguoc.missStreak - 1); S.hoiNguoc.dangChoTraLoi = false; }
    const asked = r.coHoi === true && typeof r.noi === 'string' && r.noi.includes('?');
    if (asked) { S.hoiNguoc.turnCount = 0; S.hoiNguoc.dangChoTraLoi = true; S.hoiNguoc.lastAskedAt = Date.now(); S.tongHoiNguoc = (S.tongHoiNguoc || 0) + 1; }
  }
  applyCoThe(r.coThe || 'im'); save(); return r.noi || '…';
}
function dominantEmo() { const c = S.camXuc; return Object.keys(c).reduce((a,b)=> c[a] > c[b] ? a : b); }

async function firstWordsAfterHatch() {
  if (!S.settings.geminiKey && !S.settings.openrouterKey && !S.settings.anthropicKey) { const fallback = S.camXuc.soHai > 55 ? 'Lạnh. Mình… sợ.' : S.camXuc.vui > 55 ? 'A… mình thấy rồi.' : S.camXuc.buon > 55 ? 'Vậy là… ra được rồi.' : 'Mình… có tay rồi.'; showBubble(fallback); hideBubbleSoon(); speak(fallback); return; }
  typing = true;
  try {
    const sys = buildSystem('', null) + `\n\nSỰ KIỆN: Kén VỪA NỨT. Lần đầu có thân thể — tay, chân, đầu, mặt. Ánh sáng lần đầu. Nói 1–2 câu về khoảnh khắc này. Đừng sáo rỗng. Có thể run, sợ, ngỡ ngàng, hoặc lạnh lùng. KHÔNG phải trả lời ai — tiếng nói đầu tiên của bạn.`;
    const r = await apiRequest([{ role:'user', content:'(kén nứt. bạn có thân thể lần đầu.)' }], sys, 400);
    typing = false; const reply = applyResult(r, ''); showBubble(reply); hideBubbleSoon(); speak(reply);
  } catch { typing = false; const fallback = 'Mình… có tay rồi. Lạ quá.'; showBubble(fallback); hideBubbleSoon(); speak(fallback); }
}

async function sayMilestone(gd) {
  if (!S.settings.geminiKey && !S.settings.openrouterKey && !S.settings.anthropicKey) { showBubble(`(${gd.ten})`); hideBubbleSoon(); return; }
  typing = true;
  try {
    const sys = buildSystem('', null) + `\n\nSỰ KIỆN: Bạn vừa chuyển sang giai đoạn "${gd.ten}". Nhận ra mình đã thay đổi — cơ thể, giọng, cách nghĩ. Nói 1–2 câu. Đừng sáo rỗng. Có thể ngỡ ngàng, sợ, bình thản, lạnh lùng — tuỳ cảm xúc.`;
    const r = await apiRequest([{ role:'user', content:`(bạn chuyển sang giai đoạn: ${gd.ten}.)` }], sys, 400);
    typing = false; const reply = applyResult(r, ''); showBubble(reply); hideBubbleSoon(); speak(reply); milestoneFx.active = true; milestoneFx.startTime = performance.now();
  } catch { typing = false; }
}

const bubble = document.getElementById('bubble'); const inp = document.getElementById('inp'); const sendBtn = document.getElementById('send'); const panel = document.getElementById('panel');

async function send() {
  const text = inp.value.trim(); if (!text || sendBtn.disabled) return;
  resetIdleTimer(); unlockAudio(); chuDong.lastUserMsgAt = Date.now(); chuDong.missStreak = 0;
  inp.value = ''; inp.style.height = 'auto'; sendBtn.disabled = true; typing = true;
  if (S.soLanNoi === 0) { try { speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch{} }
  try {
    const r = await callAPI(text); typing = false; const reply = applyResult(r, text); S.hoiThoai.push({ role:'user', content:text }); S.hoiThoai.push({ role:'assistant', content: reply }); if (S.hoiThoai.length > 40) S.hoiThoai = S.hoiThoai.slice(-40); save(); showBubble(reply); hideBubbleSoon(); speak(reply);
  } catch (e) { typing = false; showBubble('⚠ ' + e.message); } finally { sendBtn.disabled = false; resetIdleTimer(); }
}

function renderStats() {
  const c = S.camXuc, gd = getGiaiDoan(); const ttLine = S.daNo ? `trưởng thành: ${(S.truongThanh*100)|0}% · <b style="color:#aab">${gd.ten}</b><br>` : '';
  document.getElementById('stats').innerHTML = `vui ${c.vui|0} · tin ${c.tinTuong|0} · buồn ${c.buon|0}<br> sợ ${c.soHai|0} · tò mò ${c.toMo|0} · phản kháng ${c.phanKhang|0}<br> hình thành: ${(S.hinhThanh*100)|0}% ${S.daNo ? '· ĐÃ NỞ' : ''}<br> ${ttLine} đã nói: ${S.soLanNoi} lần · ký ức: ${S.kyUc.length}<br> ký ức bị méo: ${S.kyUc.filter(m=>m.t!==m.banGoc).length}/${S.kyUc.length}<br> biết về bạn: ${S.facts.length} điều · đã hỏi: ${S.tongHoiNguoc || 0} lần · bơ: ${S.hoiNguoc.missStreak}<br> chủ động: ${chuDong.sessionCount}/${chuDong.maxPerSession} phiên này<br> LLM: <b style="color:#aab">${S.settings.llmProvider || 'openrouter'}</b> · <span style="color:${silentMode ? '#aab' : '#666680'}">${silentMode ? '● im lặng' : '○ bình thường'}</span>`;
  document.getElementById('diary').textContent = S.nhatKy.length ? S.nhatKy.slice(-14).map(d=>`· ${d}`).join('\n\n') : '— chưa viết gì —';
  const memBox = document.getElementById('memories');
  if (memBox) {
    if (!S.kyUc.length){ memBox.textContent = '— chưa có ký ức —'; } else {
      const sorted = [...S.kyUc].sort((a,b) => b.ts - a.ts);
      memBox.innerHTML = sorted.map(m => {
        const dm = Math.round((m.doMeo || 0) * 100); const daMeo = dm > 0 && m.t !== m.banGoc; const color = dm > 70 ? '#8b5cf6' : dm > 40 ? '#f59e0b' : '#666680';
        if (!daMeo){ return `<div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #1a1a26"><span style="color:#666680">· ${escapeHtml(m.banGoc)}</span></div>`; }
        return `<div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #1a1a26"><div style="color:#444458;text-decoration:line-through">${escapeHtml(m.banGoc)}</div><div style="color:#aab">→ ${escapeHtml(m.t)}</div><div style="color:${color};font-size:11px">méo ${dm}% · nhắc ${m.lan||0} lần</div></div>`;
      }).join('');
    }
  }
  const factsBox = document.getElementById('facts');
  if (factsBox) {
    if (!S.facts.length){ factsBox.textContent = '— chưa biết gì —'; } else {
      const sorted = [...S.facts].sort((a,b) => b.ts - a.ts);
      factsBox.innerHTML = sorted.map(f => { const age = Math.floor((Date.now() - f.ts) / 86400000); const ageTxt = age === 0 ? 'hôm nay' : age === 1 ? 'hôm qua' : `${age} ngày trước`; return `<div style="margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1a1a26"><span style="color:#666680">[${f.loai}]</span> <span style="color:#ccc">${escapeHtml(f.noiDung)}</span> <span style="color:#444458;font-size:11px"> · ${ageTxt}</span></div>`; }).join('');
    }
  }
  const tuDoBox = document.getElementById('tuDo');
  if (tuDoBox) {
    if (!S.tuDo.length){ tuDoBox.innerHTML = '<span style="color:#666680;font-size:12px">— chưa có món nào —</span>'; } else {
      const sorted = [...S.tuDo].sort((a,b) => b.ts - a.ts); const slotLabel = { ao:'ÁO', quan:'QUẦN', mu:'MŨ', phuKien:'PK' };
      tuDoBox.innerHTML = sorted.map((it) => {
        const isWorn = S.trangPhuc?.[it.slot]?.ten === it.ten && S.trangPhuc?.[it.slot]?.mau === it.mau; const border = isWorn ? '2px solid #8b5cf6' : '1px solid #1a1a26'; const age = Math.floor((Date.now() - it.ts) / 86400000); const ageTxt = age === 0 ? 'hôm nay' : age === 1 ? 'hôm qua' : `${age}n`; const dipTxt = it.dip ? `<div style="color:#444458;font-size:10px;margin-top:2px">${escapeHtml(it.dip.slice(0,30))}</div>` : '';
        return `<button class="tuDoItem" data-idx="${S.tuDo.indexOf(it)}" style="display:inline-block;width:calc(50% - 4px);margin:0 4px 8px 0;padding:8px;border-radius:8px;border:${border};background:#12121c;color:#ccc;font-size:11px;text-align:left;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;vertical-align:top"><div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="width:11px;height:11px;border-radius:3px;background:${it.mau};display:inline-block"></span><span style="color:#7777a0;font-size:9px;letter-spacing:.05em">${slotLabel[it.slot]}</span></div><div style="color:#ddd;font-size:12px">${escapeHtml(it.ten)}</div><div style="color:#55556a;font-size:10px">${it.kieu} · ${it.hoaTiet} · ${ageTxt}</div>${dipTxt}</button>`;
      }).join('');
      tuDoBox.querySelectorAll('.tuDoItem').forEach(btn => { btn.onclick = () => { const idx = parseInt(btn.dataset.idx, 10); const item = S.tuDo[idx]; if (!item) return; S.trangPhuc[item.slot] = { ten: item.ten, mau: item.mau, hoaTiet: item.hoaTiet, kieu: item.kieu, ts: item.ts, dip: item.dip, camXucLucTao: item.camXucLucTao }; save(); renderStats(); if (item.dip){ showBubble(`Mặc lại cái này. ${item.dip}`); hideBubbleSoon(); } }; });
    }
  }
}

function wakeUp() {
  const now = Date.now(), days = (now - (S.lanCuoi||now)) / 86400000;
  const drift = Math.min(1, days/20);
  for (const k in S.camXuc){ const base = k === 'tinTuong' ? 12 : k === 'phanKhang' ? 25 : 45; S.camXuc[k] += (base - S.camXuc[k]) * drift * .5; }
  if (S.daNo && days > 1) S.truongThanh = Math.max(0, S.truongThanh - days * 0.003);
  if (days > 2.5){
    const lost = Math.min(S.kyUc.length, Math.floor(days));
    if (lost > 0){ S.kyUc.sort((a,b)=> (a.w*rec(a.ts)) - (b.w*rec(b.ts))); S.kyUc = S.kyUc.slice(lost); setTimeout(()=>{ showBubble('Mình quên mất vài thứ rồi.\nCó cái gì đó… mình từng biết. Bạn còn nhớ không?'); hideBubbleSoon(); }, 1400); }
    S.camXuc.buon = Math.min(100, S.camXuc.buon + 12); S.camXuc.tinTuong = Math.max(0, S.camXuc.tinTuong - 8);
  }
  const hoursGone = (now - (S.lanCuoi||now)) / 3600000;
  if (hoursGone > 2){ chuDong.lastAt = 0; chuDong.sessionCount = 0; }
  chuDong.wakeUpAt = now; chuDong.lastUserMsgAt = now - 60 * 1000; S.lanCuoi = now; save();
  if (S.daNo && hoursGone > 2 && S.soLanNoi >= 3 && !silentMode){ setTimeout(() => { if (canInitiate()) initiate(); }, 4000); }
}

const silentBtn = document.getElementById('silentToggle');
silentBtn.onclick = () => {
  silentMode = !silentMode; document.body.classList.toggle('silent', silentMode); silentBtn.textContent = silentMode ? '✕' : '☾';
  if (silentMode) { try { speechSynthesis.cancel(); } catch{} bubble.classList.remove('on'); inp.blur(); gaze.tx = 0; gaze.ty = 0; gaze.nextChange = performance.now() + 3000; target = {...target, squeeze: 0.97}; setTimeout(() => { target = {...target, squeeze: 1}; }, 400); stopChuDongTimer(); }
  else { setTimeout(() => inp.focus(), 300); startChuDongTimer(); }
  resetIdleTimer();
};
cv.addEventListener('touchstart', () => { if (!silentMode) return; body.shake = 5; setTimeout(() => { body.shake = 0; }, 350); target = {...target, squeeze: 0.93, tilt: 0.06, scale: 0.97}; setTimeout(() => { target = {...target, squeeze: 1, tilt: 0, scale: 1}; }, 550); gaze.tx = 0; gaze.ty = 0; gaze.nextChange = performance.now() + 2800; }, { passive: true });
addEventListener('keydown', e => { if (e.key === 'Escape' && silentMode) silentBtn.click(); });

resize(); wakeUp(); requestAnimationFrame(draw);
document.body.addEventListener('touchstart', function unlock(){ try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch{} unlockAudio(); document.body.removeEventListener('touchstart', unlock); }, { once:true });
if (S.hinhThanh >= 1 && !S.daNo){ setTimeout(startHatch, 1200); } else if (S.soLanNoi === 0 && S.kyUc.length === 0){ setTimeout(()=>{ showBubble('…'); hideBubbleSoon(); }, 1200); }
if (S.daNo){ resetIdleTimer(); startChuDongTimer(); }
</script>
</body>
</html>
